name: Fredbot Access preview APK

on:
  push:
    branches: [build/fredbot-access-preview-20261025]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_COMMIT: 1a8126346f43bfcb387e4b52dc6a6876eaba8a7b
    steps:
      - name: Fetch pinned public source without repository credentials
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://codeload.github.com/openclaw/openclaw/tar.gz/$SOURCE_COMMIT" -o source.tar.gz
          mkdir source
          tar -xzf source.tar.gz --strip-components=1 -C source
          sha256sum source.tar.gz > source-archive.sha256

      - name: Set up source-pinned Android toolchain
        uses: ./source/.github/actions/setup-android-toolchain
        with:
          cache-mode: 'off'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'

      - name: Prepare separate preview identity and task-only signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery "$RUNNER_TEMP/preview-signing"
          python3 - <<'PY'
          from pathlib import Path
          import json, os, secrets
          root = Path('source')
          gradle = root / 'apps/android/app/build.gradle.kts'
          original = gradle.read_text()
          identity = 'val openClawAndroidApplicationId = "ai.openclaw.app"'
          assert original.count(identity) == 1
          updated = original.replace(identity, 'val openClawAndroidApplicationId = "io.fredbot.openclaw.access"')
          version = 'versionName = openClawAndroidVersionName'
          assert updated.count(version) == 1
          updated = updated.replace(version, 'versionName = "$openClawAndroidVersionName-access-preview-20261025"')
          gradle.write_text(updated)
          manifest = root / 'apps/android/app/src/main/AndroidManifest.xml'
          original = manifest.read_text()
          assert original.count('android:label="@string/app_name"') == 2
          manifest.write_text(original.replace('android:label="@string/app_name"', 'android:label="OpenClaw Access Preview"'))
          signing = Path(os.environ['RUNNER_TEMP']) / 'preview-signing'
          password = secrets.token_urlsafe(40)
          print('::add-mask::' + password)
          (signing / 'password.txt').write_text(password)
          properties = Path.home() / '.gradle/gradle.properties'
          properties.parent.mkdir(exist_ok=True)
          properties.write_text('\n'.join([
              'OPENCLAW_ANDROID_STORE_FILE=' + str(signing / 'preview.p12'),
              'OPENCLAW_ANDROID_STORE_PASSWORD=' + password,
              'OPENCLAW_ANDROID_KEY_ALIAS=fredbot-access-preview',
              'OPENCLAW_ANDROID_KEY_PASSWORD=' + password,
          ]) + '\n')
          properties.chmod(0o600)
          metadata = {
              'sourceRepository': 'https://github.com/openclaw/openclaw',
              'sourceCommit': os.environ['SOURCE_COMMIT'],
              'upstreamPullRequest': 147307,
              'packageId': 'io.fredbot.openclaw.access',
              'label': 'OpenClaw Access Preview',
              'variant': 'thirdPartyRelease',
              'changes': ['separate application ID', 'preview version suffix', 'preview launcher label'],
              'authenticationCodeChanged': False,
              'officialOpenClawRelease': False,
          }
          Path('delivery/build-metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY
          keytool -genkeypair -keystore "$RUNNER_TEMP/preview-signing/preview.p12" -storetype PKCS12 \
            -storepass:file "$RUNNER_TEMP/preview-signing/password.txt" \
            -keypass:file "$RUNNER_TEMP/preview-signing/password.txt" \
            -alias fredbot-access-preview -keyalg RSA -keysize 3072 -validity 3650 \
            -dname 'CN=Fredbot OpenClaw Access Preview' -noprompt
          cat > "$RUNNER_TEMP/preview-signing/transport-certificate.pem" <<'CERTIFICATE'
          -----BEGIN CERTIFICATE-----
          MIID6jCCAlKgAwIBAgIUYCs++cB5qDeyTnV20QpNagzk45EwDQYJKoZIhvcNAQEL
          BQAwLzEtMCsGA1UEAwwkRnJlZGJvdCBBUEsgYnVpbGQgdHJhbnNwb3J0IDIwMjYx
          MDI1MB4XDTI2MTAyNjAzMzgzOFoXDTI2MTEyNTAzMzkzOFowLzEtMCsGA1UEAwwk
          RnJlZGJvdCBBUEsgYnVpbGQgdHJhbnNwb3J0IDIwMjYxMDI1MIIBojANBgkqhkiG
          9w0BAQEFAAOCAY8AMIIBigKCAYEAmeocxVIZjQXlPjlM/Hfave3fNIftyo+ea4/l
          nqB7aUHRzw409t2A4tMAXyhYYbOkTxQbyO2cIaUNPbJNzeW2hOxYVE+zxNL/NB2W
          by5hVuaCmDJ+7zNqujkC9mCJ1JEZvOmhRqkLIeXsbZCzLsR8A65KfcICJyPOlcvD
          ylEb/KFpUgYJ9WhpXqmZktTmFGOEoLrmFrCXnK8C08/x1BCEwpkdAEQPuxeEP6gQ
          lNmpPXOjRy8p2lEzG8v50aZZvaUj0ipDxHvbHHw8beCTnVakUqpPuFDwE2fzjkQk
          Cuy7OI8RZrfah4CGy0qSLlTTgG1DbCSMbZhY5Ht4kuaZA8ypX3VQbXomdPNrtTK/
          aCu2EoVD7NF1puL58k81PT71GgCL/y89SqmcbrOLf2dPovcEFsdkZdy9NT+BUp2N
          CAHXBKP2vbLscODS207hL7Avy42/3KeVq7DfnVEafnFdq6R7JYqpxQnSZz5jo3vf
          WwRf/+gSZ7JGFMWGWz6NWhsXQdODAgMBAAEwDQYJKoZIhvcNAQELBQADggGBAG6s
          Kx3XokJA0l/Jaq4YVmJZvlRmzr70Tf8WZ82/5UI3I2C249o0gqm4k8ktPc2vKOte
          NsBhgQo1izZ7BrC3YdKXmLMsY2lT6zvB63XUnaAnkq8nMZ71lf4blmxL53PICzTi
          J1Wp7wB4DfovcHEJBsDm18Dhs/I3lhI4c1CgPaRK56HEJ43ds1uMomijLt9xhKOV
          IgugKZZ4h4XLxHlKz1HY1v/s7NBWUNbctms5WA8rDS7tPE+zOqAEqe6GMtLfwtvi
          d4An9M+WAKWfimUEWQW6UwEC6jFryEIl6UOY5f06SbVY6vBmHHjveAY5TiAJ7aWc
          csv26CgUeATLkK1TkCvL7EGSzXOANd6vOsp4P+cR2swZLNNN0Ly5NkB6Sufsn3AQ
          qUwT6gaC2pspjbLCXcEcsdUGXFdNOUNaeu9Sxx1STtNgdu4/4QWVuSwQSQhlS0Cn
          BU+SyI1skoHaeKZmUxLCeIcSiFEQKLFtfN4adH65EDRwGG4nvfdJMFF+OyXLdw==
          -----END CERTIFICATE-----
          CERTIFICATE
          tar -C "$RUNNER_TEMP/preview-signing" -cf "$RUNNER_TEMP/preview-signing/signing.tar" preview.p12 password.txt
          openssl cms -encrypt -binary -aes-256-cbc -in "$RUNNER_TEMP/preview-signing/signing.tar" \
            -out delivery/signing-key-backup.cms -outform DER "$RUNNER_TEMP/preview-signing/transport-certificate.pem"

      - name: Install declared toolchain and build Mermaid assets
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --allow-scripts=pnpm pnpm@12.3.4
          pnpm --version
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @openclaw/normalization-core build
          pnpm --dir packages/mermaid-renderer build

      - name: Run existing Access and bootstrap regression tests
        working-directory: source/apps/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 :app:testThirdPartyDebugUnitTest \
            --tests '*CloudflareAccess*' --tests '*GatewayIngress*' --tests '*GatewayBootstrapAuth*'

      - name: Build signed non-debuggable APK
        working-directory: source/apps/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 \
            "-PopenclawBuildCommit=$SOURCE_COMMIT" \
            "-PopenclawBuildTimestamp=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            :app:assembleThirdPartyRelease

      - name: Verify package, native libraries and signature
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find source/apps/android/app/build/outputs/apk/thirdParty/release -name '*.apk' -type f)
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" delivery/OpenClaw-Access-Preview.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --verbose --print-certs delivery/OpenClaw-Access-Preview.apk > delivery/signature-verification.txt
          "$tools/aapt" dump badging delivery/OpenClaw-Access-Preview.apk > delivery/package-verification.txt
          "$tools/zipalign" -c -P 16 -v 4 delivery/OpenClaw-Access-Preview.apk > delivery/alignment-verification.txt
          grep -q "package: name='io.fredbot.openclaw.access'" delivery/package-verification.txt
          if grep -q 'application-debuggable' delivery/package-verification.txt; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('delivery/OpenClaw-Access-Preview.apk') as apk:
              for abi in ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']:
                  assert f'lib/{abi}/libsodium.so' in apk.namelist(), abi
          PY
          cp source-archive.sha256 delivery/
          cd delivery
          sha256sum OpenClaw-Access-Preview.apk build-metadata.json signing-key-backup.cms > SHA256SUMS
          cat package-verification.txt signature-verification.txt SHA256SUMS

      - name: Upload APK and verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OpenClaw-Access-Preview
          path: delivery/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Access-test-reports
          path: |
            source/apps/android/app/build/test-results/testThirdPartyDebugUnitTest/
            source/apps/android/app/build/reports/tests/testThirdPartyDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
